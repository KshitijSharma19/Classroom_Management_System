<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech - Smart Classroom Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: {
                            primary: 'var(--bg-primary)',
                            surface: 'var(--bg-surface)',
                            card: 'var(--bg-card)',
                        },
                        text: {
                            primary: 'var(--text-primary)',
                            secondary: 'var(--text-secondary)',
                        },
                        primary: 'var(--primary-color)',
                        secondary: 'var(--secondary-color)',
                        accent: 'var(--accent-color)',
                        success: 'var(--success-color)',
                        warning: 'var(--warning-color)',
                        danger: 'var(--danger-color)',
                        border: 'var(--border-color)',
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center relative bg-bg-primary text-text-primary">

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="absolute top-6 right-6 w-10 h-10 rounded-full flex items-center justify-center text-text-secondary hover:bg-bg-surface hover:text-text-primary transition-colors border border-transparent hover:border-border">
        <i id="theme-toggle-icon" class="fas fa-moon"></i>
    </button>

    <div class="w-full max-w-4xl p-6 z-10 flex flex-col md:flex-row gap-12 items-center">
        
        <!-- Left Side: Branding -->
        <div class="w-full md:w-1/2 text-center md:text-left">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary text-white mb-6 shadow-sm">
                <i class="fas fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">
                EduTech
            </h1>
            <p class="text-lg text-text-secondary mb-8 leading-relaxed max-w-sm mx-auto md:mx-0">
                A streamlined platform for students, teachers, and administrators to manage classroom activities.
            </p>
        </div>

        <!-- Right Side: Login Panel -->
        <div class="w-full md:w-1/2 bg-bg-surface rounded-2xl p-8 border border-border shadow-sm">
            <div class="mb-6">
                <h2 class="text-2xl font-bold">Sign in</h2>
            </div>

            <!-- Role Selection -->
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button class="role-btn active flex flex-col items-center justify-center gap-2 py-3 rounded-lg border border-primary bg-primary/5 text-primary transition-colors" data-role="student">
                    <i class="fas fa-user-graduate text-lg"></i>
                    <span class="font-medium text-sm">Student</span>
                </button>
                <button class="role-btn flex flex-col items-center justify-center gap-2 py-3 rounded-lg border border-border bg-bg-primary text-text-secondary hover:border-text-secondary transition-colors" data-role="teacher">
                    <i class="fas fa-chalkboard-teacher text-lg"></i>
                    <span class="font-medium text-sm">Teacher</span>
                </button>
                <button class="role-btn flex flex-col items-center justify-center gap-2 py-3 rounded-lg border border-border bg-bg-primary text-text-secondary hover:border-text-secondary transition-colors" data-role="admin">
                    <i class="fas fa-user-shield text-lg"></i>
                    <span class="font-medium text-sm">Admin</span>
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-text-primary mb-2">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-lg border border-border bg-bg-primary text-text-primary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-sm" placeholder="student@school.com" value="student@school.com">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-text-primary">Password</label>
                        <a href="#" class="text-sm text-primary hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-lg border border-border bg-bg-primary text-text-primary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-sm" placeholder="••••••••" value="password">
                </div>
                
                <button type="submit" class="w-full py-2.5 mt-2 rounded-lg bg-primary text-white font-medium hover:bg-primary/90 transition-colors flex justify-center items-center gap-2 text-sm shadow-sm">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-text-secondary">
                <p>Use default credentials (e.g. student@school.com) for demonstration.</p>
            </div>
        </div>
    </div>

    <!-- Main Scripts -->
    <script src="js/store.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/config.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = auth.getCurrentUser();
            if (user) {
                if (user.role === 'student') window.location.href = 'student.html';
                if (user.role === 'teacher') window.location.href = 'teacher.html';
                if (user.role === 'admin') window.location.href = 'admin.html';
            }

            let selectedRole = 'student';
            const roleBtns = document.querySelectorAll('.role-btn');
            const emailInput = document.getElementById('email');

            roleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    roleBtns.forEach(b => {
                        b.classList.remove('border-primary', 'bg-primary/5', 'text-primary');
                        b.classList.add('border-border', 'bg-bg-primary', 'text-text-secondary', 'hover:border-text-secondary');
                    });
                    
                    btn.classList.remove('border-border', 'bg-bg-primary', 'text-text-secondary', 'hover:border-text-secondary');
                    btn.classList.add('border-primary', 'bg-primary/5', 'text-primary');
                    
                    selectedRole = btn.dataset.role;
                    
                    if (selectedRole === 'student') emailInput.value = 'student@school.com';
                    if (selectedRole === 'teacher') emailInput.value = 'teacher@school.com';
                    if (selectedRole === 'admin') emailInput.value = 'admin@school.com';
                });
            });

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = emailInput.value;
                const password = document.getElementById('password').value;
                
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                submitBtn.disabled = true;

                setTimeout(() => {
                    if (auth.login(email, password, selectedRole)) {
                        ui.showToast('Login successful!', 'success');
                    } else {
                        ui.showToast('Invalid credentials or role mismatch', 'error');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                }, 500); 
            });
        });
    </script>
</body>
</html>
